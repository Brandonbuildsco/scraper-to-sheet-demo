# Runs the scraper every day on GitHub's servers and saves the results
# back into this repo. Also has a "Run workflow" button for manual runs.
name: Daily scrape

on:
  schedule:
    - cron: "17 11 * * *"     # every day at 11:17 UTC (7:17 am Eastern)
    - cron: "43 * * * *"      # TEMP test: hourly at :43, remove once a scheduled run works
  workflow_dispatch:           # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the job commit the updated CSV files

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests first (stop if the parser is broken)
        run: python -m pytest -q

      - name: Scrape
        env:
          # Optional - only used if you add these as repository secrets
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scraper.py

      - name: Save results to the repo
        run: |
          git config user.name "scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily scrape $(date -u +%Y-%m-%d)"
          git push
